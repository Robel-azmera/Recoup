      rel="stylesheet"
    />
    <script>
      // Apply the theme before first paint to avoid a flash.
      try {
        const t = localStorage.getItem('recoup-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
      } catch {}
    </script>
  </head>

    <div id="root"></div>

  </body>
