[project]
name = "recoup-api"
version = "0.1.0"
description = "Recoup — AI Payment Operations Analyst API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "firebase-admin>=6.6",
  "stripe>=11.0",
  "google-genai>=1.0",
  "google-api-python-client>=2.150",
  "google-auth>=2.36",
  "httpx>=0.27",
  "resend>=2.4",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
  "honcho>=2.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["E501", "RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[[tool.mypy.overrides]]
module = ["firebase_admin.*", "google.cloud.*", "googleapiclient.*", "resend.*", "google.oauth2.*", "google.auth.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
